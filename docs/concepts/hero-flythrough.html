<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gitlines — hero: fly-through</title>
<link rel="icon" href="../assets/favicon.png"><link rel="stylesheet" href="../assets/widget.css">
<style>
  :root { --ink:#090C10; --text:#EDF2F7; --muted:#8592A3; --green:#38CC75; --font:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Inter, Arial, sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace; }
  * { box-sizing:border-box; } body { margin:0; background:var(--ink); color:var(--text); font-family:var(--font); -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  .hint { position:fixed; inset:0 0 auto 0; z-index:3; display:flex; justify-content:space-between; padding:18px 24px; font-family:var(--mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .scroll { height:800vh; } .stick { position:sticky; top:0; height:100vh; overflow:hidden; }
  #gl, #css { position:absolute; inset:0; } #css { pointer-events:none; }
  .node { width:880px; } /* CSS3D objects are laid out at their natural size, then placed in the scene */
  .node .lbl { position:absolute; left:0; top:-40px; font-family:var(--mono); font-size:22px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); }
  .cap { position:absolute; left:6vw; bottom:9vh; max-width:560px; pointer-events:none; }
  .cap h1 { font-size:clamp(30px,4.4vw,60px); letter-spacing:-.03em; line-height:1.02; margin:0 0 10px; } .cap p { margin:0; color:var(--muted); font-size:17px; }
  .cap .k { font-family:var(--mono); font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--green); margin-bottom:10px; }
  .dots { position:absolute; right:6vw; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:14px; }
  .dots i { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.2); transition:background .2s, transform .2s; } .dots i.on { background:var(--green); transform:scale(1.5); }
</style>
</head>
<body>
<div class="hint"><span>Gitlines · hero: fly-through</span><span>Scroll ↓</span></div>
<div class="scroll" id="scroll"><div class="stick">
  <div id="gl"></div><div id="css"></div>
  <div class="cap"><div class="k" id="k"></div><h1 id="h"></h1><p id="p"></p></div>
  <div class="dots" id="dots"></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
<script src="../assets/widget.js"></script>
<script>
(function(){
  var order = ['default','glasshouse','phosphor','broadsheet','arcade','blockwork'], SP = 9, blurbs = {};
  Gitlines.THEMES.forEach(function(t){ blurbs[t.key] = t.blurb; });
  var scene = new THREE.Scene(); scene.fog = new THREE.FogExp2(0x090C10, .075);
  var cssScene = new THREE.Scene();
  var cam = new THREE.PerspectiveCamera(50, 1, .1, 200);
  var gl = new THREE.WebGLRenderer({ antialias:true, alpha:true }); gl.setPixelRatio(Math.min(devicePixelRatio, 2)); document.getElementById('gl').appendChild(gl.domElement);
  var css = new THREE.CSS3DRenderer(); document.getElementById('css').appendChild(css.domElement);
  var chalk = new THREE.MeshStandardMaterial({ color:0xEDECE8, roughness:.4, emissive:0x1a1a1a });
  var green = new THREE.MeshStandardMaterial({ color:0x38CC75, emissive:0x38CC75, emissiveIntensity:.45 });
  var coral = new THREE.MeshStandardMaterial({ color:0xF26166, emissive:0xF26166, emissiveIntensity:.45 });
  var V = THREE.Vector3;
  /* trunk: a long tube down -Z with a lazy sway */
  var trunkPts = []; for (var z=4; z>=-SP*7; z-=1) trunkPts.push(new V(Math.sin(z*.25)*.6, Math.cos(z*.2)*.3 - .9, z));
  var trunk = new THREE.CatmullRomCurve3(trunkPts); scene.add(new THREE.Mesh(new THREE.TubeGeometry(trunk, 200, .07, 10, false), chalk));
  var nodes = [], objs = [];
  order.forEach(function(key, i){
    var z = -SP*(i+1), side = i%2 ? 1 : -1, tp = trunk.getPointAt(Math.min(1, (4 - z)/(4 + SP*7)));
    var end = new V(side*2.6, .9, z);
    /* branch from trunk out to the widget node */
    var br = new THREE.CubicBezierCurve3(tp.clone(), new V(tp.x, tp.y, z+2.5), new V(end.x, end.y-1.2, z+1.2), end);
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(br, 40, .05, 8, false), i%3===2 ? coral : (i%3===1 ? green : chalk)));
    var sph = new THREE.Mesh(new THREE.SphereGeometry(.16, 20, 20), chalk); sph.position.copy(end); scene.add(sph); nodes.push(sph);
    /* the widget itself, as live DOM in the CSS3D scene */
    var el = document.createElement('div'); el.className = 'node'; 
    var wd = document.createElement('div'); el.appendChild(wd); Gitlines.mount(wd, key);
    var o = new THREE.CSS3DObject(el); o.position.set(end.x + side*.3, end.y + 1.6, z); o.rotation.y = -side*.35; o.scale.setScalar(.0055); cssScene.add(o); objs.push(o);
  });
  /* dust */
  var pts = new Float32Array(2400*3); for (var p=0;p<pts.length;p+=3){ pts[p] = (Math.random()-.5)*30; pts[p+1] = (Math.random()-.5)*16; pts[p+2] = 6 - Math.random()*SP*8; }
  var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pts, 3)); scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color:0x8592A3, size:.05, transparent:true, opacity:.5 })));
  scene.add(new THREE.AmbientLight(0xffffff, .5)); var dl = new THREE.DirectionalLight(0xffffff, .9); dl.position.set(2, 5, 4); scene.add(dl);
  var pl = new THREE.PointLight(0x38CC75, 1.2, 14); scene.add(pl);
  var dots = document.getElementById('dots'); order.forEach(function(){ dots.appendChild(document.createElement('i')); });
  function resize(){ var w = innerWidth, h = innerHeight; cam.aspect = w/h; cam.updateProjectionMatrix(); gl.setSize(w, h); css.setSize(w, h); }
  addEventListener('resize', resize); resize();
  var scroll = document.getElementById('scroll'), target = 0, cur = 0, mx = 0, my = 0, curI = -1;
  addEventListener('mousemove', function(e){ mx = e.clientX/innerWidth-.5; my = e.clientY/innerHeight-.5; });
  addEventListener('scroll', function(){ var r = scroll.getBoundingClientRect(); target = Math.min(1, Math.max(0, -r.top/(r.height-innerHeight))); }, { passive:true });
  /* the camera dwells in front of each node: progress is stretched so 60% of each segment is a hold */
  function stretch(p){ var seg = p*6, i = Math.floor(seg), t = seg - i; if (i>=6) return 6; var m = t < .6 ? 0 : (t-.6)/.4; return i + (m<.5 ? 4*m*m*m : 1-Math.pow(-2*m+2,3)/2); }
  function frame(){
    cur += (target - cur) * .08; var s = stretch(cur), i = Math.min(5, Math.round(s)), a = s/6;
    var z = -SP*(s) - 1.2, look = trunk.getPointAt(Math.min(1, (4 - z + 4)/(4 + SP*7)));
    /* stand off in front of the current node, looking at it */
    var side = i%2 ? 1 : -1; var o = objs[i];
    var tz = o.position.z + 7.5, tx = o.position.x*.55 + mx*.6, ty = o.position.y*.6 + .4 - my*.4;
    cam.position.set(cam.position.x + (tx - cam.position.x)*.08, cam.position.y + (ty - cam.position.y)*.08, cam.position.z + (tz - cam.position.z)*.08);
    cam.lookAt(o.position.x*.7, o.position.y*.6 - .1, o.position.z - 4);
    pl.position.copy(nodes[i].position); pl.position.y += 1.2;
    nodes.forEach(function(n, k){ n.scale.setScalar(k===i ? 1.6 : 1); });
    if (i !== curI){ curI = i;  [].forEach.call(dots.children, function(d, k){ d.classList.toggle('on', k===i); }); }
    gl.render(scene, cam); css.render(cssScene, cam); requestAnimationFrame(frame);
  }
  cam.position.set(0, .6, 8); frame();
})();
</script>
</body>
</html>
