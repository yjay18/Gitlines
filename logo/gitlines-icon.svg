<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Subtle 2D Tone) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2026"/>
      <stop offset="100%" stop-color="#141519"/>
    </linearGradient>

    <!-- Subtle Edge Stroke -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <!-- macOS App Icon Squircle Canvas -->
  <rect x="32" y="32" width="960" height="960" rx="216" ry="216" fill="url(#bgGradient)" stroke="url(#borderGradient)" stroke-width="4"/>

  <!-- GIT MONOLINE FLOW GRAPHIC -->
  <g transform="translate(0, 0)">
    <!-- Left Inflow Branch (Top) -->
    <path d="M 240 390 C 360 390, 420 512, 512 512" 
          fill="none" 
          stroke="#EDECE8" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Left Inflow Branch (Bottom) -->
    <path d="M 240 634 C 360 634, 420 512, 512 512" 
          fill="none" 
          stroke="#EDECE8" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right Outflow Branch (Top - Additions Path) -->
    <path d="M 512 512 C 604 512, 650 390, 744 390" 
          fill="none" 
          stroke="#EDECE8" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right Outflow Branch (Bottom - Deletions Path) -->
    <path d="M 512 512 C 604 512, 650 634, 744 634" 
          fill="none" 
          stroke="#EDECE8" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Center Git Commit Node -->
    <circle cx="512" cy="512" r="64" fill="#18191E" stroke="#EDECE8" stroke-width="32"/>
    <circle cx="512" cy="512" r="16" fill="#EDECE8"/>

    <!-- Addition Indicator (+) [Muted Sage Green] -->
    <g stroke="#7B9E87" stroke-width="32" stroke-linecap="round">
      <line x1="808" y1="390" x2="880" y2="390"/>
      <line x1="844" y1="354" x2="844" y2="426"/>
    </g>

    <!-- Deletion Indicator (-) [Muted Terracotta Red] -->
    <g stroke="#C86C5A" stroke-width="32" stroke-linecap="round">
      <line x1="808" y1="634" x2="880" y2="634"/>
    </g>
  </g>
</svg>
