<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- GITLINES 2D MONOLINE LOGO MARK (MONOCHROME CURRENTCOLOR) -->
  <g transform="translate(-140, -262)" stroke="currentColor" fill="none" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Inflow Branch (Top) -->
    <path d="M 240 390 C 360 390, 420 512, 512 512" />

    <!-- Left Inflow Branch (Bottom) -->
    <path d="M 240 634 C 360 634, 420 512, 512 512" />

    <!-- Right Outflow Branch (Top) -->
    <path d="M 512 512 C 604 512, 650 390, 744 390" />

    <!-- Right Outflow Branch (Bottom) -->
    <path d="M 512 512 C 604 512, 650 634, 744 634" />

    <!-- Center Git Commit Node -->
    <circle cx="512" cy="512" r="64" />
    <circle cx="512" cy="512" r="16" fill="currentColor" />

    <!-- Plus (+) -->
    <line x1="808" y1="390" x2="880" y2="390"/>
    <line x1="844" y1="354" x2="844" y2="426"/>

    <!-- Minus (-) -->
    <line x1="808" y1="634" x2="880" y2="634"/>
  </g>
</svg>
